<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="600" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="52" font-weight="bold" fill="#F5F8FC" text-anchor="middle">AI: Your Smart Intern</text>
  <text x="600" y="130" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" fill="#F2A33C" text-anchor="middle">Fast. Eager. Sometimes wrong.</text>

  <!-- Great at -->
  <rect x="90" y="180" width="480" height="310" rx="16" fill="#0F2433" stroke="#2DD4BF" stroke-width="3"/>
  <text x="330" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#2DD4BF" text-anchor="middle">GREAT AT</text>
  <circle cx="125" cy="275" r="7" fill="#2DD4BF"/>
  <text x="150" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#E8F6F4">Drafting — emails, reports, proposals</text>
  <circle cx="125" cy="325" r="7" fill="#2DD4BF"/>
  <text x="150" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#E8F6F4">Summarising — long documents, notes</text>
  <circle cx="125" cy="375" r="7" fill="#2DD4BF"/>
  <text x="150" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#E8F6F4">Structuring — outlines, plans, checklists</text>
  <circle cx="125" cy="425" r="7" fill="#2DD4BF"/>
  <text x="150" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#E8F6F4">Brainstorming — ideas and new angles</text>
  <circle cx="125" cy="475" r="7" fill="#2DD4BF"/>
  <text x="150" y="482" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#E8F6F4">Translating — languages and jargon</text>

  <!-- Don't trust -->
  <rect x="630" y="180" width="480" height="310" rx="16" fill="#2A1A10" stroke="#F2A33C" stroke-width="3"/>
  <text x="870" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#F2A33C" text-anchor="middle">DON'T TRUST BLINDLY</text>
  <circle cx="665" cy="275" r="7" fill="#F2A33C"/>
  <text x="690" y="282" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#FDF3E3">Facts &amp; figures — it can hallucinate</text>
  <circle cx="665" cy="325" r="7" fill="#F2A33C"/>
  <text x="690" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#FDF3E3">Math — check every calculation</text>
  <circle cx="665" cy="375" r="7" fill="#F2A33C"/>
  <text x="690" y="382" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#FDF3E3">Judgment — no stakes in your life</text>
  <circle cx="665" cy="425" r="7" fill="#F2A33C"/>
  <text x="690" y="432" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" fill="#FDF3E3">Your private data — unless you share it</text>

  <!-- Rules band -->
  <rect x="90" y="525" width="1020" height="110" rx="16" fill="#12263A" stroke="#F5F8FC" stroke-width="1.5"/>
  <text x="600" y="558" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#F5F8FC" text-anchor="middle">THE 3 RULES</text>
  <text x="220" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#B8C4D4" text-anchor="middle">1 · Verify everything</text>
  <text x="600" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#B8C4D4" text-anchor="middle">2 · Context matters</text>
  <text x="980" y="600" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" fill="#B8C4D4" text-anchor="middle">3 · It learns from you</text>
</svg>
