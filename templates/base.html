<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}21 Days of AI | AILiteracy.ng{% endblock title %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#b7f34a",
                        "background-light": "#f6f3ea",
                        "background-dark": "#101b18",
                        "deep-blue": "#122a25",
                        "accent-dark": "#101816",
                        ink: "#14201d",
                        cream: "#f6f3ea",
                        coral: "#ff7a59"
                    },
                    fontFamily: {
                        display: ["Manrope", "sans-serif"],
                        editorial: ["Newsreader", "serif"]
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        [x-cloak] {
            display: none !important;
        }

        html { scroll-behavior: smooth; }

        body {
            background: radial-gradient(circle at 12% 8%, rgba(183, 243, 74, 0.11), transparent 27rem), #f6f3ea;
        }

        .soft-grid {
            background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        .challenge-copy > :first-child { margin-top: 0; }
        .challenge-copy h1,
        .challenge-copy h2,
        .challenge-copy h3 { color: #14201d; letter-spacing: -0.025em; }
        .challenge-copy h1 { font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; }
        .challenge-copy h2 { margin-top: 2.75rem; font-size: 1.65rem; }
        .challenge-copy h3 { margin-top: 2rem; font-size: 1.25rem; }
        .challenge-copy p,
        .challenge-copy li { color: #42504c; line-height: 1.85; }
        .challenge-copy blockquote {
            border-left: 4px solid #b7f34a;
            background: #eef7d9;
            border-radius: 0 1rem 1rem 0;
            padding: 1rem 1.25rem;
            color: #20342e;
        }
        .challenge-copy code { border-radius: .4rem; background: #e9ece4; padding: .12rem .35rem; color: #193f35; }

        .nigerian-pattern {
            background-color: transparent;
            background-image: radial-gradient(#66ffcc 0.5px, transparent 0.5px), radial-gradient(#66ffcc 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            opacity: 0.12;
        }

        .auth-form input[type="email"],
        .auth-form input[type="password"],
        .auth-form input[type="text"] {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.625rem 0.875rem;
            background: #ffffff;
        }

        .auth-form input:focus {
            outline: none;
            border-color: #66ffcc;
            box-shadow: 0 0 0 2px rgba(102, 255, 204, 0.25);
        }

        .auth-form p {
            margin-bottom: 0.85rem;
        }

        .auth-form p label {
            display: block;
            margin-bottom: 0.35rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-background-light text-ink font-display antialiased">
    {% include "includes/nav.html" %}

    <main class="flex-1">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            {% if messages %}
                <div class="space-y-3 mb-6">
                    {% for message in messages %}
                        <div class="rounded-xl border border-primary/30 bg-white px-4 py-3 text-sm text-slate-700 shadow-sm">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        </div>
        {% block content %}{% endblock content %}
    </main>

    {% include "includes/footer.html" %}
</body>
</html>
