services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailiteracy_app
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ailiteracy_worker
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media_data:/app/media

  db:
    image: postgres:16-alpine
    container_name: ailiteracy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ailiteracy}
      POSTGRES_USER: ${POSTGRES_USER:-ailiteracy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ailiteracy_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    container_name: ailiteracy_nginx
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
